# Beispiel: Betriebsart UND Einstellungen (Heizkurve, Hysterese, Brauchwasser-Soll) aus Home Assistant lesen/aendern.
#
# Wie luxtronik-v1-esp32.yaml, plus zwei Auswahlfelder "Modus Heizung" / "Modus Warmwasser".
# Schutz vor unnoetigen EEPROM-Schreibzugriffen der Steuerung (jeder Schreibvorgang wird mit 999 gespeichert):
#  - es wird NIE beim Booten oder beim Zuruecklesen geschrieben (set_action laeuft nur bei Bedienung)
#  - nur wenn der aktuelle Wert gelesen wurde und sich vom Wunsch unterscheidet
#  - Sperrfrist 5 Minuten zwischen zwei Schreibvorgaengen
#  - Abfragen sind waehrend des Schreibens pausiert (set_paused), danach wird zurueckgelesen
# Einstellungen (Heizkurve, Hysterese, Brauchwasser-Soll) sind zusaetzlich mit dem Schalter
# "Einstellungen entsperren" gesichert (10 min gueltig, wird nach jedem Schreibvorgang wieder ausgeschaltet).
# Nicht aus Automationen verwenden, die oft schalten.
#
esphome:
  name: luxtronik_v1
  friendly_name: Luxtronik_v1 Waermepumpe

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

# Enable logging
logger:
  # disable serial loggin
  baud_rate: 0

web_server:

# Enable Home Assistant API
api:

# Enable MQTT
#mqtt:
#  broker: <your mqtt broker ip>

ota:
  platform: esphome

uart:
  id: uart_bus
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 57600
  data_bits: 8
  parity: NONE
  stop_bits: 1
#  debug:
#    direction: BOTH
#    dummy_receiver: false

external_components:
  - source:
      type: git
      url: https://github.com/cbrosius/luxtronik_v1
      ref: main
    components: [ luxtronik_v1_component ]
    refresh: 0s
  # Die Funktionen set_paused()/is_paused() der Komponente werden vom Script benoetigt.

